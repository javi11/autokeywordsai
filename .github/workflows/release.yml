name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the plugin zip
        run: bin/build-zip.sh

      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/autokeywordsai.zip
